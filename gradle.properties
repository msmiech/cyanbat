org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# A build reuses its configuration while no build file changed, the outputs of tasks it ran before
# (in this checkout or another, such as a worktree), and runs the modules side by side.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true
# Off a Mac, leave the iOS targets alone. Kotlin could cross-compile them from Linux or Windows, but
# only after downloading its Native toolchain (about 800 MB), and CI's ios job compiles and tests
# them on macOS anyway. commonMain is still compiled as common code on every host, so a JVM-only
# API there fails the build anywhere. For the full check off a Mac, pass
# -Pkotlin.native.enableKlibsCrossCompilation=true.
kotlin.native.enableKlibsCrossCompilation=false
# ...without a warning on every build that they were skipped.
kotlin.native.ignoreDisabledTargets=true
# The version every artifact carries: APK, MSI, DMG and DEB alike. It is stamped before a release is
# tagged, because F-Droid builds the tagged source as it is; the release workflow checks that the tag
# agrees, and passes it on as -Pcyanbat.version. See the root build.gradle.kts for how it becomes a
# versionCode and a packageVersion.
cyanbat.version=3.7
# What cyanbat.version comes to as a versionCode (major * 10000 + minor * 100 + patch), written out
# for F-Droid's update check, which reads it with a regular expression. The build fails when the two
# disagree.
cyanbat.versionCode=30700
