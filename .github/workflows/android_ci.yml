name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Only checkout is needed; do not inherit the repository's default token scopes.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Also validates the Gradle wrapper jar checksum (validate-wrappers
      # defaults to true) and caches dependencies - no separate steps needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` = assemble (debug + release) + check (unit tests + lint).
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
