name: Release

# Pushing a version tag builds every artifact and publishes them as a GitHub release.
#
# Tags are matched with and without a leading `v`, because the repository has used both: the tags
# themselves are bare (`1.0`, `1.2`) while the release titles carry the prefix. A suffixed tag such
# as `2.1-rc1` publishes as a pre-release.
#
# workflow_dispatch runs the same build and uploads the artifacts to the run, but never publishes -
# it is how you rehearse a release, or check the installers, without spending a tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on a trial build. Nothing is published.'
        required: true
        default: '0.0.0-dev'

# Only the publish job writes anything; everything else just reads the repository.
permissions:
  contents: read

# Never cancel a release in flight - a half-uploaded release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # The input is interpolated through the environment rather than into the script text, so a
      # crafted value cannot become shell.
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            publish=false
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi

          # Same shape the Gradle build enforces; failing here costs seconds instead of a build.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-.+)?$'; then
            echo "::error::'$version' is not major.minor[.patch][-suffix]"
            exit 1
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $version (publish=$publish, prerelease=$prerelease)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 2.0 introduces a new keystore, the 1.x one having been lost. Android identifies an app by
      # its signature, so that makes 2.0 a fresh install rather than an update - a one-off break
      # taken deliberately. Every release from 2.0 on has to keep using the same keystore.
      # Absent on pull requests by design, where secrets are not exposed.
      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be unsigned."
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cyanbat.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # An unsigned APK cannot be installed at all, so publishing one would be shipping a file
      # nobody can use. A rehearsal build is allowed to carry on without a keystore.
      - name: Require a keystore before publishing
        if: needs.version.outputs.publish == 'true' && steps.keystore.outputs.configured != 'true'
        run: |
          echo "::error::Refusing to publish an unsigned APK. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets, then re-run this workflow. See README.md, Cutting a release."
          exit 1

      # `build` assembles every module and runs its tests and lint, so the release is gated on a
      # green suite rather than merely on a tag existing. It produces the release APK on the way.
      - name: Build and test
        env:
          # Points at nothing when no secret was set, which the Gradle config reads as "unsigned".
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/cyanbat.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew build "-Pcyanbat.version=${{ needs.version.outputs.version }}"

      - name: Collect the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ steps.keystore.outputs.configured }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          # Matches the name 1.2 shipped under, so the download link keeps its shape.
          if [ "$SIGNED" = "true" ]; then
            cp "$apk" "artifacts/cyanBat-release-$VERSION.apk"
          else
            cp "$apk" "artifacts/cyanBat-release-$VERSION-unsigned.apk"
          fi
          ls -l artifacts

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  desktop:
    # jpackage can only build for the platform it runs on, so each installer needs its own runner.
    name: Desktop ${{ matrix.format }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      # One platform failing should not deny the other two their installers; the publish job still
      # refuses to run unless every one of them succeeded.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
          - os: windows-latest
            format: msi
          - os: macos-latest
            format: dmg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to dpkg-deb, which needs fakeroot to stage file ownership.
      - name: Install Debian packaging tools
        if: matrix.format == 'deb'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Package the installer
        run: ./gradlew :desktop:packageDistributionForCurrentOS "-Pcyanbat.version=${{ needs.version.outputs.version }}"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.format }}
          path: desktop/build/compose/binaries/main/${{ matrix.format }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [version, android, desktop]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The only job that writes, and the only one that needs a token that can.
    permissions:
      contents: write
    steps:
      # gh infers the repository from the checkout, and --generate-notes needs the tag history.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'release-*'
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ls -l artifacts

          flags=(--title "v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # Re-running the workflow on an existing tag should refresh the assets rather than fail
          # halfway through, so an interrupted publish can simply be run again.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" artifacts/*
          fi

          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
