name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Only checkout is needed; do not inherit the repository's default token scopes.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Also validates the Gradle wrapper jar checksum (validate-wrappers
      # defaults to true) and caches dependencies - no separate steps needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # `build` covers every module - :app, :engine, :game and :desktop - assembling each
      # and running its unit tests and lint. It leaves the iOS targets of :engine and :game to
      # the ios job; see gradle.properties.
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The shared code built for iOS, and its tests run on the simulator. Nothing else in CI builds for
  # iOS - the build job skips it - and Kotlin/Native is a different compiler and runtime from the
  # JVM's, so the tests passing there proves little about iOS.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The device target is only compiled; there is no device to run it on. The Kotlin plugin
      # picks the first available iOS simulator for the tests on its own. Linking the test binaries
      # runs Compose through Kotlin/Native, which is heavier than anything the JVM build does, so
      # the daemon gets more heap here than gradle.properties gives it.
      - name: Compile for iOS and run the shared tests on the simulator
        run: >-
          ./gradlew :engine:compileKotlinIosArm64 :game:compileKotlinIosArm64
          :engine:iosSimulatorArm64Test :game:iosSimulatorArm64Test
          "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-ios
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
